services:
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3847:8080"
    environment:
      DATABASE_URL: postgres://notes:notes@db:5432/notes
      JWT_SECRET: local-dev-secret-change-in-cloud
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
